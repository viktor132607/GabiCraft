name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GabiCraft.Client

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://gabicraft.onrender.com

      - name: Verify SEO output
        run: |
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/og-image.png
          grep -q "sitemap.xml" out/robots.txt
          grep -q "https://gabicraft.onrender.com/project" out/sitemap.xml
          grep -q 'rel="canonical"' out/index.html
          grep -q 'property="og:image"' out/index.html
          grep -q 'name="twitter:image"' out/index.html
          grep -q 'og:image:width' out/index.html
          grep -q 'og:image:height' out/index.html
          grep -q 'application/ld+json' out/index.html
          grep -q 'ImageObject' out/index.html
          grep -q 'rel="canonical"' out/about.html
          grep -q 'rel="canonical"' out/project.html
          grep -q 'rel="canonical"' out/contact.html
          for slug in \
            topla-zhivopis \
            estestveni-formi \
            tsvyat-i-svetlina \
            zemna-palitra \
            avtorski-serii \
            dekorativni-kompozitsii
          do
            test -f "out/project/${slug}.html"
            grep -q "https://gabicraft.onrender.com/project/${slug}" out/sitemap.xml
            grep -q 'rel="canonical"' "out/project/${slug}.html"
            grep -q 'property="og:image"' "out/project/${slug}.html"
            grep -q 'application/ld+json' "out/project/${slug}.html"
            grep -q 'BreadcrumbList' "out/project/${slug}.html"
          done

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GabiCraft.Server

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GabiCraft.Server.sln

      - name: Build
        run: dotnet build GabiCraft.Server.sln --configuration Release --no-restore
